<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Shared medical report · MediGuide AI</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 Arial, sans-serif; color: #17212b; background: #f3f7f9; }
    body { margin: 0; padding: 24px; }
    main { max-width: 860px; margin: 0 auto; padding: 24px; background: #fff; border: 1px solid #d5e0e5; border-radius: 12px; }
    .notice { padding: 12px; background: #edf6fa; border: 1px solid #a8cbd9; border-radius: 8px; }
    .report-warning { padding: 10px; border: 1px solid #9a5c00; border-radius: 8px; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    h2 { margin: 20px 0 8px; font-size: 1.15rem; }
    section { border-top: 1px solid #d5e0e5; padding-top: 8px; break-inside: avoid; }
    dl > div { display: grid; grid-template-columns: minmax(120px, 180px) 1fr; gap: 12px; margin: 6px 0; }
    dt { font-weight: 700; }
    dd { margin: 0; overflow-wrap: anywhere; }
    footer { margin-top: 24px; border-top: 1px solid #d5e0e5; padding-top: 12px; }
    button { min-height: 44px; margin-bottom: 16px; padding: 8px 14px; border: 0; border-radius: 8px; background: #0a6c8f; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #17212b; outline-offset: 3px; }
    @media (max-width: 560px) { body { padding: 10px; } main { padding: 16px; } dl > div { grid-template-columns: 1fr; gap: 2px; } }
    @media print { :root, body { background: #fff; } body { padding: 0; } main { max-width: none; border: 0; padding: 0; } button, .notice { display: none; } }
  </style>
</head>
<body>
  <main>
    <p id="shareStatus" class="notice" role="status" aria-live="polite">Checking this report link…</p>
    <button id="printReport" type="button" hidden>Print or save as PDF</button>
    <article id="sharedReport" aria-live="polite"></article>
  </main>
  <script type="module" src="js/sharedReport.js"></script>
</body>
</html>
